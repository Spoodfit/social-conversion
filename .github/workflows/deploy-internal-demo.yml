name: Deploy Social Conversion Internal Demo

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Tape DEPLOY_DEMO pour confirmer le déploiement interne
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: social-conversion-internal-demo
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Require explicit confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != "DEPLOY_DEMO" ]; then
            echo "Deployment cancelled: confirmation must be DEPLOY_DEMO"
            exit 1
          fi

      - name: Check out current recovery candidate
        uses: actions/checkout@v4
        with:
          ref: recovery/social-conversion-production

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-fund

      - name: Verify candidate
        run: |
          npm audit --omit=dev --audit-level=high
          npm run verify
          npm run validate:production-config

      - name: Enforce demo-only safety flags
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('wrangler.jsonc', 'utf8');
          const demo = /"DEMO_MODE"\s*:\s*"true"/.test(source);
          const liveOff = /"LIVE_READY"\s*:\s*"false"/.test(source);
          if (!demo || !liveOff) {
            console.error('Internal demo deployment blocked: DEMO_MODE must be true and LIVE_READY must be false.');
            process.exit(1);
          }
          console.log('Demo-only safety flags validated.');
          NODE

      - name: Apply pending D1 migrations
        run: npx wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker and assets
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
