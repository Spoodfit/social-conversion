name: Deploy Social Conversion Validation

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Tape DEPLOY_VALIDATION pour confirmer la mise en ligne privée
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: social-conversion-validation
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Require explicit confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != "DEPLOY_VALIDATION" ]; then
            echo "Deployment cancelled: confirmation must be DEPLOY_VALIDATION"
            exit 1
          fi

      - name: Check out current validation candidate
        uses: actions/checkout@v7
        with:
          ref: recovery/social-conversion-production

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-fund

      - name: Verify candidate
        run: |
          npm audit --omit=dev --audit-level=high
          npm run verify
          npm run validate:production-config

      - name: Enforce real validation flags and domain
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('wrangler.jsonc', 'utf8');
          const demoOff = /"DEMO_MODE"\s*:\s*"false"/.test(source);
          const liveOn = /"LIVE_READY"\s*:\s*"true"/.test(source);
          const validationEnv = /"APP_ENV"\s*:\s*"validation"/.test(source);
          const domain = /"pattern"\s*:\s*"social\.neptunebusiness\.com"/.test(source);
          if (!demoOff || !liveOn || !validationEnv || !domain) {
            console.error('Validation deployment blocked: expected APP_ENV=validation, DEMO_MODE=false, LIVE_READY=true and social.neptunebusiness.com.');
            process.exit(1);
          }
          console.log('Private live validation configuration validated.');
          NODE

      - name: Apply pending D1 migrations
        run: npx wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker and assets
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
