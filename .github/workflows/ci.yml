name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - recovery/social-conversion-production

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-fund
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Generate Cloudflare types
        run: npm run cf-typegen
      - name: TypeScript
        shell: bash
        run: |
          set +e
          npm run typecheck 2>&1 | tee typecheck.log
          status=${PIPESTATUS[0]}
          exit $status
      - name: Upload typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          if-no-files-found: ignore
      - name: Worker tests
        run: npm test
      - name: Recovery safety audit
        run: npm run audit:recovery
      - name: Validate deployment config
        run: npm run validate:production-config
      - name: Build
        run: npm run build
      - name: Wrangler dry-run
        run: npm run cf:check

  deploy-validation:
    if: github.event_name == 'push' && github.ref == 'refs/heads/recovery/social-conversion-production'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-fund
      - name: Generate Cloudflare types
        run: npm run cf-typegen
      - name: Build validated candidate
        run: npm run build
      - name: Apply pending D1 migrations
        run: npx wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy validation Worker and assets
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
