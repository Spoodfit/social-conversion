name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - recovery/social-conversion-production

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-fund
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Generate Cloudflare types
        run: npm run cf-typegen
      - name: TypeScript
        run: npm run typecheck
      - name: Worker tests
        run: npm test
      - name: Recovery safety audit
        run: npm run audit:recovery
      - name: Build
        run: npm run build
      - name: Wrangler dry-run
        run: npm run cf:check
